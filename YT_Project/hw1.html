   <!DOCTYPE html>
 <html>
    <head>
        <title>Exercise</title>
        <style>
            .des{
                width: 300px;
                display: inline-block;
                text-align: left;
                vertical-align: middle;
            }
            .yes , .no{
                display: inline-block;
                margin-bottom: 20px;
            }
        </style>
    </head>
    <body>
        <p class="des">
            Thanks for Chatting with our customer support. Would you like to take our Quick Survey?
        </p>
        <button class="yes">Yes</button>
        <button class="no">No</button>
    </body>
 </html>
