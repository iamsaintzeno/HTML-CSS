<!-- 7-E -->
 <!DOCTYPE html>
<html>
    <head>
        <title>Exercise</title>
        <style>
            .search-bar{
                height: 36px;
                width: 400px;
                border-radius: 20px;
                border: 1px solid rgb(190,190,190);
                padding-left: 20px;
                box-shadow: 2px 2px 80px black;
            }
            .search-bar::placeholder{
                color: rgb(150,150,150);
            }
        </style>
    </head>
    <body>
        <input class="search-bar" type="textbox" placeholder="Search Google or type a URL">
    </body>
</html>
