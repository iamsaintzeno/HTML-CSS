<!DOCTYPE html>
<html>
    <head>
        <title>Animal page</title>
        <style>
            p{
                margin-top: 0px;
                margin-bottom: 0px;
            }
            .profile-card{
                width: 200px;
                height: 305 px;
                display: inline-block;
                vertical-align: top;
                box-shadow:  2px 2px 30px rgb(96,96,96);
                border-radius: 2px;
                margin-right: 5px;
            }
            .content{
                width: 200px;
                height: 200px;
                display: block;
                border-radius: 2px;
            }
            .name-block{
                display: block;
            }
            .name{
                margin-left: 10px;
                margin-top: 3px;
                font-weight: bold;
            }
            .profile-info{
                display: block;
                margin-top: 10px;
                margin-left: 10px;
                margin-bottom: 5px;
            }
            .profile-pic{
                width: 30px;
                display: inline-block;
                border-radius: 100%;
                vertical-align: top;
                margin-left: 0px;
                margin-right: 5px;
            }
            .info{
                width: 100px;
                font-size: 14px;
                margin-left: 3px;
                display: inline-block;
                vertical-align: middle;
                color: rgb(96,96,96);
            }
            .button-sign{
                color: white;
                background-color: rgb(52, 52, 161);
                padding: 6px 15px;
                border-radius: 4px;
                margin-left: 4px;
                margin-right: 4px;
            }
            .button-sign:hover{
                opacity: 80%;
            }
            .button-sign:active{
                background-color: white;
                color: rgb(52, 52, 161);
            }
            .button-card{
                padding: 7px;
            }
        </style>
    </head>
    <body>
        <div class="profile-card">
            <div>
                <img class="content" src="thumbnails/image1.jpg">
            </div>
            <div class="name-block">
                <p class="name">Oliver</p>
            </div>
            <div class="profile-info">
                <img class="profile-pic" src="authors/image1.jpg">
                <p class="info" >2 mutual friends</p>
            </div>
            <div class="button-card">
                <button class="button-sign" >Add Friend</button>
            </div>
        </div>
        <div class="profile-card">
            <div>
                <img class="content" src="thumbnails/image2.jpg">
            </div>
            <div class="name-block">
                <p class="name">Mimi</p>
            </div>
            <div class="profile-info">
                <img class="profile-pic" src="authors/image1.jpg">
                <p class="info" >3 mutual friends</p>
            </div>
            <div class="button-card">
                <button class="button-sign" >Add Friend</button>
            </div>
        </div>
        <div class="profile-card">
            <div>
                <img class="content" src="thumbnails/image3.webp">
            </div>
            <div class="name-block">
                <p class="name">Rex</p>
            </div>
            <div class="profile-info">
                <img class="profile-pic" src="authors/image1.jpg">
                <p class="info" >4 mutual friends</p>
            </div>
            <div class="button-card">
                <button class="button-sign" >Add Friend</button>
            </div>
        </div>
        
    </body>
</html>
